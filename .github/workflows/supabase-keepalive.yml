name: Supabase keepalive

# Projeto Supabase free pausa após 7 dias sem atividade no banco.
#
# `*/6` no campo dia-do-mês dá 1, 7, 13, 19, 25, 31 — intervalo máximo de 6 dias
# (do 25 pro 1 do mês seguinte, em mês de 30 dias). Cabe na janela de 7 dias, com
# 1 dia de margem. Essa margem NÃO sobrevive a uma execução pulada: o GitHub pode
# atrasar ou descartar agendamentos sob carga, e aí o intervalo vira 12 dias. Se
# isso acontecer, troque por `0 6 * * *` (diário) — o job leva ~10s.
on:
  schedule:
    - cron: '0 6 */6 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Toca o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY."
            exit 1
          fi

          status=$(curl --silent --show-error --fail-with-body \
            --output /tmp/keepalive.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}') || {
              echo "::error::Ping falhou (HTTP ${status:-sem resposta}): $(cat /tmp/keepalive.txt)"
              exit 1
            }

          echo "HTTP $status — resposta: $(cat /tmp/keepalive.txt)"
